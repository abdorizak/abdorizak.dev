- order: 1
  name: x_logger
  slug: x-logger
  category: Open Source
  year: '2026'
  role: Author & Maintainer
  description: Configurable logging for Flutter — named loggers, levels, pretty / JSON / colored output, filtering, and async export of the log history to a shareable file. Published on pub.dev.
  longDescription: |
    x_logger is a configurable logging package for Flutter, published on pub.dev.
    It gives apps named loggers (one per subsystem), log levels, and pluggable
    printers for pretty, JSON or colored output — all configured once and reused
    across the app.

    Every record flows through three independent, swappable stages — a filter
    (whether to log), a printer (how it looks) and an output (where it goes) — so
    a single call can fan out to the console, an async on-device file, an in-app
    stream and a ring buffer at once. The history can be exported as a string or
    handed to a native share sheet, and it runs on Android, iOS, macOS, Windows
    and Linux. I built it during Wacyi to give the apps real, user-shareable
    diagnostics.
  highlights:
    - Named loggers per subsystem with cheap child() labels sharing one config
    - Pluggable printers — Simple, boxed Pretty, JSON, or fully custom Callback
    - ANSI color output with flexible header and timestamp formatting
    - Composable filtering by level, name or predicate, globally or per output
    - Multiple destinations — console, async file, stream and memory ring buffer
    - Export and share the log file on Android, iOS, macOS, Windows and Linux
  links:
    - label: pub.dev
      url: https://pub.dev/packages/x_logger
      icon: pub
  icon: https://raw.githubusercontent.com/abdorizak/x_logger/main/doc/banner.png
  preview: https://raw.githubusercontent.com/abdorizak/x_logger/main/doc/banner.png
  url: https://github.com/abdorizak/x_logger
  color: '#7c3aed'
  repo: x_logger
  owner: abdorizak
  stack:
    - Dart
    - Flutter
  screenshots:
    - src: https://raw.githubusercontent.com/abdorizak/x_logger/main/doc/banner.png
      caption: x_logger — configurable logging for Flutter

- order: 2
  name: Max Player
  slug: max-player
  category: Open Source
  year: '2024'
  role: Author & Maintainer
  description: A professional, production-ready video player for Flutter with a YouTube-style UI out of the box — plays network, asset, file, YouTube and Vimeo sources, with quality control, playback speed, fullscreen and rich playback streams.
  longDescription: |
    Max Player is a professional, production-ready video player package for
    Flutter, published on pub.dev. Built on `video_player` and `flutter_riverpod`,
    it ships with a polished, YouTube-style UI out of the box — gradient overlays,
    double-tap seek and auto-hiding controls — so teams get a complete playback
    experience without building one from scratch.

    It plays from virtually any source — network, assets, files, YouTube and
    Vimeo (including private videos) — and exposes the controls production apps
    need: adaptive quality selection, 0.5x–3x playback speed, fullscreen with
    auto-rotation, thumbnails, wakelock and a fully customizable theme. Real-time
    position, buffered, status and error streams give developers fine-grained
    control, while built-in error handling, auto-retry and buffering-timeout
    detection keep playback robust on real-world networks.
  highlights:
    - Plays network, asset, file, YouTube and Vimeo (incl. private) sources from one API
    - YouTube-style UI with gradient overlays, double-tap seek and auto-hide controls
    - Adaptive quality control, 0.5x–3x playback speed and fullscreen with auto-rotation
    - Real-time position, buffered, status and error streams for fine-grained control
    - Robust error handling — auto-retry, buffering-timeout detection and built-in retry UI
    - Customizable theme, thumbnails and wakelock; published on pub.dev for iOS & Android
  links:
    - label: pub.dev
      url: https://pub.dev/packages/max_player
      icon: pub
  icon: https://raw.githubusercontent.com/abdorizak/max_player/refs/heads/main/mx_logo.png
  preview: https://raw.githubusercontent.com/abdorizak/max_player/refs/heads/main/mx_logo.png
  url: https://github.com/abdorizak/max_player
  color: '#6366f1'
  repo: max_player
  owner: abdorizak
  stack:
    - Flutter
    - Dart
    - Riverpod
    - video_player

- order: 3
  name: Expense Tracker App
  slug: expense-tracker-app
  category: Mobile
  year: '2022'
  role: iOS Developer
  description: A native iOS expense tracker built 100% in Swift with a fully programmatic UI. Authenticate, log income and expenses, and visualise daily cash flow in an interactive line chart.
  longDescription: |
    Expense Tracker is a native iOS app for managing personal income and
    expenses. It offers secure user authentication and a clean, fully
    programmatic UIKit interface — no storyboards — following the MVC pattern,
    with support down to the iPhone SE.

    You can record income and expenses and review them as an interactive line
    chart or a table, switching between the two with a UISegmentedControl. Under
    the hood it uses URLSession with async/await and a generic networking layer,
    native image caching with NSCache, an image picker built on Photos / PhotosUI,
    and custom alert and view components throughout.
  highlights:
    - 100% Swift, fully programmatic UIKit (no storyboards), MVC architecture
    - Secure user authentication with add and track income and expenses
    - Daily cash flow as an interactive line chart and table via UISegmentedControl
    - Generic networking with URLSession async/await and NSCache image caching
    - Custom alert views, image picker (Photos / PhotosUI) and iPhone SE support
  icon: other/expenses-Tracker.jpeg
  preview: other/expenses-Tracker.jpeg
  url: https://github.com/abdorizak/Expense-Tracker-App
  color: '#4d8af0'
  repo: Expense-Tracker-App
  stack:
    - Swift
    - UIKit
    - iOS
    - Charts

- order: 4
  name: Hisnul Muslim
  slug: hisnul-muslim
  category: Mobile
  year: '2023'
  role: iOS Developer
  description: A native iOS supplications app — 100+ authentic adhkar from the Quran and Sunnah, with search, bookmarks and scheduled reminders. Built 100% in Swift with programmatic UIKit and Combine.
  longDescription: |
    Hisnul Muslim (حِصن المسلم) is a native iOS app that puts the classic book of
    Muslim supplications in your pocket — over 100 authentic adhkar drawn from the
    Quran and Sunnah, organised thematically for morning and evening, specific
    occasions, protection and guidance. It's free, with no ads or in-app
    purchases.

    Built 100% in Swift with a programmatic UIKit interface and the Combine
    framework on an MVVM architecture, it supports bookmarking and searching
    supplications, local reminders scheduled to the user's chosen time via
    UNUserNotificationCenter, and offline storage in Core Data. It runs on iPhone
    and iPad (including iPhone SE) from iOS 15, with full dark and light mode
    support.
  highlights:
    - 100+ authentic supplications from the Quran and Sunnah, organised by theme
    - 100% Swift with programmatic UIKit, Combine and an MVVM architecture
    - Bookmark and search supplications, with reminders via UNUserNotificationCenter
    - Offline storage in Core Data; runs on iPhone and iPad from iOS 15
    - Dark and light mode, async/await, and refined alert and empty-state handling
    - Free to use, with no ads or in-app purchases
  links:
