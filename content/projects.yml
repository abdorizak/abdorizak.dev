- order: 0
  name: Wacyi
  slug: wacyi
  category: Web
  year: '2024 – Present'
  role: Tech Lead & Full-stack Developer
  description: Wacyi is a comprehensive Islamic learning platform — Quran, Hisnul Muslim, lessons, podcasts and community — on web, iOS and Android, localised in English, Arabic and Somali.
  longDescription: |
    Wacyi is a comprehensive Islamic learning platform that unifies the Holy
    Quran, supplications, structured lessons, and community into a single
    experience across web, iOS, and Android. It delivers the Quran in Madani
    script with audio recitations and tafseer, the complete Hisnul Muslim
    collection of authentic adhkar, interactive Arabic and Islamic-science
    courses, podcasts, and curated content from leading Somali scholars — all
    fully searchable and localized in English, Arabic, and Somali.

    I lead Wacyi as its tech lead, and have shaped the product from inception.
    It launched in late 2024 (originally as "Masjid Abii Hureyra," later
    rebranded to Wacyi) and entered full-scale development in early 2025. The
    initial architecture combined Frappe with a Go API for media uploads and
    user management; I subsequently led a complete migration to a standalone,
    fully Go-powered backend paired with a Next.js front-end — giving the
    platform end-to-end ownership of its data, performance, and roadmap.
  highlights:
    - Complete Quran in Madani script with audio recitations and integrated tafseer
    - Full Hisnul Muslim library, interactive courses, podcasts, and Somali-scholar content
    - Unified smart search across surahs, lessons, scholars, and topics
    - Community forum and events, fully localized in English, Arabic, and Somali
    - Native iOS and Android apps backed by a fast Next.js web experience
    - Architected and led the migration to a standalone, Go-powered backend
